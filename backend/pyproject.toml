[project]
name = "talentsync-backend"
version = "0.1.0"
description = "TalentSync AI — backend API (modular monolith, FastAPI + SQLAlchemy + PostgreSQL/pgvector)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24",
    # P3 — AI Engine
    "pgvector>=0.3",     # tipe Vector(384) utk kolom embedding (PostgreSQL)
    "reportlab>=4.2",    # ekspor PDF CV hasil optimasi (M8)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]
# Ekstra AI: model embedding lokal (M3). torch di Windows: PyPI = CPU-only;
# di Linux/CI gunakan index CPU pytorch agar install ringan:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
ai = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008: idiom FastAPI (Depends(...) sebagai default argumen) dipakai luas di fase berikutnya.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
