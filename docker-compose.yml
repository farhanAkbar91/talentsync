# TalentSync AI — full stack lokal (P0).
# Jalankan: docker compose up --build
#   web  → http://localhost:3000  (frontend + proxy /api)
#   api  → http://localhost:8000  (docs: /docs)
#   db   → PostgreSQL 16 + pgvector (hanya ter-expose ke 127.0.0.1)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentsync_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-talentsync}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentsync} -d ${POSTGRES_DB:-talentsync}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-talentsync}:${POSTGRES_PASSWORD:-talentsync_dev_only}@db:5432/${POSTGRES_DB:-talentsync}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
